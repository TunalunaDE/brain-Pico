# N-tier overnight power-cut run on the noknok-pi rig (old Pi 4 in the cellar; PicoHub J1 on Testing Plug 1,
# Pico on the Pi's USB) - shape for T-PWR-003 / DEV-230. Every 6 min: J1 plug AND all Pi USB VBUS cut for 5 s
# (both, or the Pico keeps running on the other supply), 90 s settle, then check_after_cut.py must see the
# right brain back with uptime < 150 s (proof of a real reset), all six modules, no strikes, no faults.
# 8 h = ~80 cuts (limit 20/h). The USB cut also drops the LinkE and the Debug Probe for 5 s (harmless).
# Run from tools/bench/rig/ with BENCH_SUDO_PW set (uhubctl):
#   nohup python3 run_night.py examples/powercut_soak_noknok_pi.toml > ~/runs/nohup.out 2>&1 &
mode = "loop"
rig = "noknok-pi"
test_id = "T-PWR-003"
max_hours = 8
plug = "Test1"
usb_cut_hub = "2"
cut_seconds = 5
max_cuts_per_hour = 20
cycle_every_s = 360
settle_s = 90
command = "python3 check_after_cut.py $BRAIN_IP --device $EXPECT --max-uptime 150 --modules buzzer,display,knob,ledbutton,leds16,picohub"
command_timeout_s = 480
stop_after_fails = 3
supply_check_every_s = 1800
brain_ip = "SET-ME"            # the cellar brain on the home LAN (DHCP): find_brain.py, then check its device id
expect_device = "SET-ME"       # its device id from /rpc hello
env = { EXPECT = "SET-ME" }    # same device id, for the per-cycle check
